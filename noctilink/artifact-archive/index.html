<h1>noctilink artifact archive</h1>
<p>这是 noctilink 项目维护者使用的个人构建归档工具。它把项目导出的安装包、Xcode 工程、签名归档和编辑器应用备份到维护者自己的 Google Drive，在上传校验通过后按平台、渠道和产物类型保留本地最新版。</p>
<p>此工具通过本机脚本和 rclone 运行，不提供公共注册服务。归档文件保持私有，网页不提供任何安装包、项目源码或账户凭据。</p>
<p><a href="privacy.html">隐私政策 / Privacy policy</a></p>
